apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fleet.name" . }}
  labels: {{- include "fleet.labels" . | nindent 4 }}
  annotations:
    # Losing it costs only the sparklines, but there's no reason to throw
    # it away on an uninstall-and-reinstall.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
