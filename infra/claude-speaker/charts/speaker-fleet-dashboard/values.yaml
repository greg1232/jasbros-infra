# Deployed by ./jasbros dashboard deploy, which sets image.tag and fills in
# `speakers` from infra/inventory.yaml.

image:
  repository: docker.io/gdiamos/speaker-fleet-dashboard
  tag: ""
  pullPolicy: IfNotPresent

pollSeconds: 15
timeoutSeconds: 3
wifiEveryMinutes: 5
downAfterMinutes: 5
historyDays: 7
rescan:
  enabled: true
  subnet: 192.168.4.0/22
  port: 8080
  everyMinutes: 5

# [{name: bedroom, url: "http://192.168.4.22:8080"}] — addresses are hints;
# a speaker that has moved is found by name.
speakers: []

ingress:
  enabled: true
  path: /speakers

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

persistence:
  size: 1Gi
  storageClass: local-path
