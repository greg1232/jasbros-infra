# Everything gmk is, from a fresh Ubuntu server.  ./jasbros gmk provision
#
# Safe to run again: a second run should report changed=0
# (./jasbros gmk provision --twice checks exactly that).

- name: Provision gmk
  hosts: servers
  become: true
  roles:
    - { role: base, tags: [base] }
    - { role: k3s, tags: [k3s] }
    - { role: helm, tags: [helm] }
    - { role: display, tags: [display] }
