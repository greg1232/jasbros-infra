- name: Bring packages up to date
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install what the rest of provisioning needs
  ansible.builtin.apt:
    name: [curl, jq, htop, iw, lvm2, unattended-upgrades]
    state: present

- name: Say if an upgrade wants a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required
  changed_when: false

- name: Reboot needed
  ansible.builtin.debug:
    msg: "gmk wants a reboot for an upgrade. Nothing here reboots it — ssh in
      and run `sudo reboot` when nothing important is running."
  when: reboot_required.stat.exists

# --- swap: kubelet won't start with it on, and 14 GiB doesn't need it.

- name: Turn swap off now
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0
  changed_when: true

- name: Keep swap off after a reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1   # off for Kubernetes (jasbros)'

- name: Remove the swap file
  ansible.builtin.file:
    path: /swap.img
    state: absent

# --- disk: / is 98 GB of a 477 GB disk out of the box.

- name: Grow / to {{ gmk_root_size }}
  community.general.lvol:
    vg: ubuntu-vg
    lv: ubuntu-lv
    size: "{{ gmk_root_size }}"
    shrink: false
    resizefs: true

# --- what Kubernetes networking needs from the kernel.

- name: Load the kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/jasbros-k8s.conf
    content: |
      br_netfilter
      overlay
    mode: "0644"

- name: Load the kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [br_netfilter, overlay]

- name: Kubernetes sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-jasbros-k8s.conf
    reload: true
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      net.ipv4.ip_forward: 1
      net.bridge.bridge-nf-call-iptables: 1
      net.bridge.bridge-nf-call-ip6tables: 1
      fs.inotify.max_user_instances: 512
      fs.inotify.max_user_watches: 524288

# --- Wi-Fi: a radio that naps drops kubectl and dashboard polls.

- name: Keep Wi-Fi power saving off
  ansible.builtin.template:
    src: wifi-powersave-off.service.j2
    dest: /etc/systemd/system/jasbros-wifi-powersave-off.service
    mode: "0644"
  notify: Turn Wi-Fi power saving off

- name: Run the Wi-Fi power saving unit, now and at boot
  ansible.builtin.systemd_service:
    name: jasbros-wifi-powersave-off.service
    state: started
    enabled: true
    daemon_reload: true
  # In a dry run the unit above was never written, so there is nothing to find.
  ignore_errors: "{{ ansible_check_mode }}"

# gmk's radio is a Realtek RTL8852BE, whose driver can put power saving
# back after a reconnect. Its own switch holds for good, from the next
# time the driver loads — this never reloads it, since that would cut the
# connection provisioning is running over.
- name: Is the Wi-Fi driver rtw89
  ansible.builtin.stat:
    path: /sys/module/rtw89_core
  register: rtw89

- name: Turn power saving off in the rtw89 driver, from the next boot
  ansible.builtin.copy:
    dest: /etc/modprobe.d/jasbros-rtw89.conf
    content: |
      # Managed by jasbros — infra/gmk/roles/base
      options rtw89_core disable_ps_mode=y
    mode: "0644"
  when: rtw89.stat.exists

# --- firewall: LAN in, cluster traffic through, everything else out.

- name: Allow the LAN in on the ports gmk serves
  community.general.ufw:
    rule: allow
    from_ip: "{{ lan_subnet }}"
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443", "6443"]

- name: Allow pod and service traffic
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop: [10.42.0.0/16, 10.43.0.0/16]

- name: Let pods route out through gmk
  community.general.ufw:
    rule: allow
    route: true
    from_ip: "{{ item }}"
  loop: [10.42.0.0/16, 10.43.0.0/16]

- name: Firewall on, deny anything else incoming
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
