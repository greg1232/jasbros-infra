# A restart, not a reload: a reload leaves the devices it already holds.
# Safe on gmk because the Wi-Fi is systemd-networkd's, not NetworkManager's.
- name: Restart NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: restarted
  when: "'NetworkManager.service' in ansible_facts.services | default({})"

- name: Restart k3s
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
  when: k3s_installed.rc == 0
