# Deployed by ./jasbros candy deploy, which sets image.tag and fills in the
# speaker's address from infra/inventory.yaml.

image:
  repository: docker.io/gdiamos/candy-watch
  tag: ""
  pullPolicy: IfNotPresent

speaker:
  name: office
  url: ""                 # http://<address>:8080, from the inventory

ingress:
  enabled: true
  path: /candy

# One CPU and 1 GiB at most, as asked. The detector runs on one thread
# (~25 ms a frame, one frame a second) and decoding a 4K still for Claude is
# the biggest thing in memory.
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
