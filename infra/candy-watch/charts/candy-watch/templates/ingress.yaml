{{- if .Values.ingress.enabled }}
# /candy on gmk's address, with the prefix stripped so the app lives at /.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "candy.name" . }}-strip
  labels: {{- include "candy.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes: [{{ .Values.ingress.path | quote }}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "candy.name" . }}
  labels: {{- include "candy.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "candy.name" . }}-strip@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "candy.name" . }}
                port: { name: http }
{{- end }}
