{{- if not .Values.image.tag }}
{{- fail "image.tag is empty — deploy with ./jasbros candy deploy" }}
{{- end }}
{{- if not .Values.speaker.url }}
{{- fail "speaker.url is empty — deploy with ./jasbros candy deploy" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "candy.name" . }}
  labels: {{- include "candy.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never two at once: two watchers would welcome every group twice, ask
  # Claude twice, and talk over each other on the speaker.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "candy.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "candy.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: candy-watch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The camera's address and login, from ./jasbros candy camera.
          # Optional: without it there's no picture, and everything else works.
          envFrom:
            - secretRef:
                name: {{ include "candy.name" . }}-camera
                optional: true
            # The Claude API key, from ./jasbros candy key. Without it the
            # pod still tracks people; it just never asks Claude.
            - secretRef:
                name: {{ include "candy.name" . }}-claude
                optional: true
          env:
            - name: SPEAKER
              value: "{{ .Values.speaker.name }}={{ .Values.speaker.url }}"
            - { name: PORT, value: "8000" }
            - { name: STATE, value: /data/state.json }
            # This app as the speakers reach it: gmk's own address, from
            # Kubernetes, so it is right even after gmk has moved (D11).
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: HERE
              value: "http://$(HOST_IP){{ .Values.ingress.path }}"
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: clip, mountPath: /clip, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ include "candy.name" . }} }
        # Made from the laptop by ./jasbros candy clip, never by this chart:
        # the clip is from a film, and this repo is public.
        - name: clip
          configMap:
            name: {{ include "candy.name" . }}-clip
            optional: true
