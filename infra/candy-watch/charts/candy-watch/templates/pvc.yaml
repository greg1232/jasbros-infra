apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "candy.name" . }}
  labels: {{- include "candy.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  # Just the on/off switch, so a restart doesn't quietly switch it off.
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 16Mi
